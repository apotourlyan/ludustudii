name: CI

# Runs the same gate as a developer: make check (ADR 0020), and beside it
# the end-to-end browser tests, make test-e2e (ADR 0034). The test database
# comes from the devcontainer's compose file and tool versions from the same
# sources as the devcontainer (ADR 0028).
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels its older run. Runs on main always
# finish, so every commit there gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Go, Node, the frontend dependencies and Playwright's Chromium.
      - name: Set up the tools
        uses: ./.github/actions/setup

      - name: Install golangci-lint
        run: make install-golangci-lint

      # Only db_test starts; its healthcheck makes --wait block until
      # Postgres accepts connections.
      - name: Start test database
        run: docker compose -f .devcontainer/docker-compose.yml up -d --wait db_test

      # MOCK_BUILD=1 runs the app tests on a build of the mock mode rather
      # than on Vite's dev server, which transforms every module on every
      # page load (playwright.mock.config.ts). PLAYWRIGHT_WORKERS runs them
      # with more workers than half of the runner's 4 cores, still capped by
      # memory (tests/playwright.base.ts).
      - name: make check
        env:
          DB_TEST_CONNECTION: postgres://tester:tester@localhost:5433/ludustudii_db_test?sslmode=disable
          MOCK_BUILD: "1"
          PLAYWRIGHT_WORKERS: "3"
        run: make check

      # The app tests' report, with the traces and screenshots of failed
      # tests. It exists only when make check got as far as frontend-test.
      - name: Upload the app tests' report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-mock
          path: frontend/playwright-report/mock
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: make test-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The same setup as check, without golangci-lint, which only lints.
      - name: Set up the tools
        uses: ./.github/actions/setup

      - name: Start test database
        run: docker compose -f .devcontainer/docker-compose.yml up -d --wait db_test

      # Builds the client app and the binary, and runs the tests on a
      # database it creates and drops on the test server.
      - name: make test-e2e
        env:
          DB_TEST_CONNECTION: postgres://tester:tester@localhost:5433/ludustudii_db_test?sslmode=disable
        run: make test-e2e

      # The report, with the traces and screenshots of failed tests.
      - name: Upload the end-to-end tests' report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report/e2e
          if-no-files-found: ignore
          retention-days: 14
