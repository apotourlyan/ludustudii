# golangci-lint v2.15.0; settings checked against its .golangci.reference.yml.
version: "2"
run:
  build-tags: [unit, integration, apidocs]
linters:
  # Standard checks enabled by default:
  # errcheck: Finds unchecked error return values.
  # govet: Detects suspicious constructs and common mistakes.
  # ineffassign: Finds assignments whose values are never used.
  # staticcheck: Detects bugs and suggests code simplifications.
  # unused: Finds unused declarations.
  # Deliberately off (omitted from standard + enable):
  # wrapcheck: Stores may return raw DB errors; handlers own logging and context.
  # testpackage: In-package handler tests replace function-field seams.
  # gochecknoglobals: Package-level domain values are intentional.
  # exhaustruct: Partial struct literals and zero-value defaults are intentional.
  # varnamelen: Short idiomatic names are fine in a clear scope.
  # wsl: Blank-line layout follows readability and the formatters.
  # nlreturn: Returns do not need mandatory preceding blank lines.
  # ireturn: Interface returns are allowed for useful abstractions.
  # mnd: Name literals for domain meaning, not merely because they are numbers.
  # lll: Wrap lines for readability rather than a fixed column limit.
  # funlen: Keep cohesive functions and table-driven tests together.
  # gocognit: Review control flow for clarity rather than a numeric threshold.
  # paralleltest: Choose parallelism per test; tparallel checks consistency.
  default: standard
  enable:
    # Errors and control flow.
    - errorlint # Checks error comparisons, assertions, and wrapping.
    - nilerr # Finds nil error returns after checking a non-nil error.
    - nilnil # Flags returning both a nil value and a nil error.
    - exhaustive # Checks that enum switches cover every value.

    # Resource ownership and request contexts.
    - rowserrcheck # Checks that SQL row iteration errors are inspected.
    - sqlclosecheck # Finds SQL rows and statements that are not closed.
    - bodyclose # Finds HTTP response bodies that are not closed.
    - noctx # Flags HTTP requests made without an explicit context.
    - contextcheck # Checks that calls inherit the caller's context.

    # Security and architecture boundaries.
    - gosec # Detects potentially insecure Go code.
    - depguard # Enforces package import boundaries.
    - forbidigo # Forbids selected APIs, such as direct environment access.

    # Tests and test helpers.
    - usetesting # Suggests testing APIs such as t.Context and t.Setenv.
    - thelper # Checks test helper parameters and calls to Helper.
    - tparallel # Checks consistent use of parallel tests and cleanup.

    # Documentation, naming, and logging.
    - revive # Checks exported declarations and package documentation here.
    - godot # Checks that documentation comments end with a period.
    - misspell # Finds common spelling mistakes in comments.
    - errname # Checks error type names and sentinel error names.
    - sloglint # Enforces structured logging arguments, keys, and context use.
    - nolintlint # Requires specific linters and explanations in nolint directives.

    # Simplification and efficiency.
    - usestdlibvars # Suggests standard library constants for known literal values.
    - copyloopvar # Finds unnecessary copies of loop variables.
    - intrange # Suggests ranging over integers for suitable counting loops.
    - unconvert # Finds unnecessary type conversions.
    - perfsprint # Suggests simpler alternatives to formatting calls.
    - modernize # Suggests modern Go language and standard library features.

    # Trial checks retained after a quiet baseline.
    - unparam # Finds unused function parameters and always-identical results.
    - gocritic # Detects suspicious constructs and suggests style improvements.
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    usetesting:
      context-background: true
      context-todo: true
    revive:
      rules:
        - name: exported
        - name: package-comments
    sloglint:
      no-mixed-args: true
      key-naming-case: snake
      context: scope
    depguard:
      rules:
        kit:
          files: ["**/internal/kit/*.go", "**/internal/kit/**/*.go", "!$test"]
          deny:
            - pkg: github.com/apotourlyan/ludustudii/internal/infra
              desc: kit must remain independent of infrastructure
            - pkg: github.com/apotourlyan/ludustudii/internal/services
              desc: kit must remain independent of services
            - pkg: github.com/apotourlyan/ludustudii/internal/app
              desc: kit must remain independent of application wiring
        services:
          files: ["**/internal/services/*.go", "**/internal/services/**/*.go", "!$test"]
          deny:
            - pkg: github.com/apotourlyan/ludustudii/internal/app
              desc: services must remain independent of application wiring
            - pkg: github.com/apotourlyan/ludustudii/internal/infra
              desc: services must remain independent of infrastructure
        # The shared front and the process lifecycle serve any composition of
        # surfaces, so they must not know any surface. Their tests follow the
        # same rule, so the packages are tested without a surface.
        front:
          files: ["**/internal/app/router/*.go", "**/internal/app/server/*.go"]
          deny:
            - pkg: github.com/apotourlyan/ludustudii/internal/app
              desc: router and server must remain independent of the composition root and surfaces
            - pkg: github.com/apotourlyan/ludustudii/internal/services
              desc: router and server must remain independent of services
            - pkg: github.com/apotourlyan/ludustudii/internal/infra/health
              desc: router and server must remain independent of the probes surface
            - pkg: github.com/apotourlyan/ludustudii/internal/infra/spa
              desc: router and server must remain independent of the client app surface
            - pkg: github.com/apotourlyan/ludustudii/internal/infra/apidocs
              desc: router and server must remain independent of the API reference surface
            - pkg: github.com/apotourlyan/ludustudii/internal/infra/rdb
              desc: router and server must remain independent of the database
        api-surface:
          files: ["**/internal/app/api/*.go", "!$test"]
          deny:
            - pkg: github.com/apotourlyan/ludustudii/internal/app
              desc: the API surface must remain independent of the composition root and the shared front
            - pkg: github.com/apotourlyan/ludustudii/internal/infra/health
              desc: the API surface must remain independent of the probes surface
            - pkg: github.com/apotourlyan/ludustudii/internal/infra/spa
              desc: the API surface must remain independent of the client app surface
            - pkg: github.com/apotourlyan/ludustudii/internal/infra/apidocs
              desc: the API surface must remain independent of the API reference surface
        testkit:
          files: ["!$test"]
          deny:
            - pkg: github.com/apotourlyan/ludustudii/internal/testkit
              desc: testkit is only for test files
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^fmt\.Print.*$'
          msg: use the structured logger
        - pattern: '^log\..*$'
          pkg: '^log$'
          msg: use log/slog
        - pattern: '^os\.(Getenv|LookupEnv)$'
          msg: read environment through internal/infra/env
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets: [std-error-handling, common-false-positives]
    generated: lax
    paths:
      - internal/infra/apidocs/dist
      - internal/infra/spa/dist
    rules:
      # Security fixtures intentionally include unsafe inputs.
      - path: '_test\.go$'
        linters: [gosec]
      # Environment access belongs to the configuration boundary and test harness.
      - path: 'internal/(infra/env|testkit)/'
        linters: [forbidigo]
        text: '^use of `os\.(Getenv|LookupEnv)`'
formatters:
  enable:
    - gofumpt # Applies stricter Go source formatting.
    - goimports # Adds missing imports, removes unused imports, and sorts them.
  exclusions:
    generated: lax
    paths:
      - internal/infra/apidocs/dist
      - internal/infra/spa/dist
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
