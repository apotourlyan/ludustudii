ErrorResponse:
  type: object
  additionalProperties: false
  required: [code]
  properties:
    code:
      type: string
      enum:
        - bind_error
        - validation_error
        - cross_origin_request
        - not_found
        - method_not_allowed
        - payload_too_large
        - unsupported_media_type
        - unexpected_error
    errors:
      type: array
      description: Per-field failures, included only for validation_error responses.
      minItems: 1
      items:
        $ref: '#/FieldError'
FieldError:
  type: object
  additionalProperties: false
  required: [field, code]
  properties:
    field:
      type: string
      example: title
    code:
      type: string
      description: |
        Card fields (title, description) report required or max_length.
        Registration reports required, max_length, invalid_format or taken
        (email) and required, invalid_characters, min_length or max_length
        (password). Query parameters report invalid_integer or out_of_range
        (limit) and invalid_cursor (cursor). Path IDs report invalid_uuid7
        (id). untrimmed and not_normalized are reserved: fields are
        canonicalized before validation, so these codes are not currently
        returned.
      enum: [invalid_uuid7, invalid_cursor, required, min_length, max_length, invalid_format, invalid_characters, taken, untrimmed, not_normalized, invalid_integer, out_of_range]
