InvalidQuery:
  description: Invalid query parameters return validation_error with field errors. Malformed or overflowing limits report invalid_integer; out-of-range limits report out_of_range; invalid cursor tokens report invalid_cursor.
  headers:
    X-Request-Id:
      $ref: '../headers.yml#/RequestId'
    Cache-Control:
      $ref: '../headers.yml#/CacheControlNoStore'
  content:
    application/json:
      schema:
        $ref: '../schemas/errors.yml#/ErrorResponse'
      example:
        code: validation_error
        errors:
          - field: limit
            code: out_of_range
InvalidCreateInput:
  description: |
    Malformed JSON, incompatible JSON types and unknown fields, including
    the card's read-only created_at and updated_at, return bind_error. Empty
    bodies and invalid field values return validation_error.
  headers:
    X-Request-Id:
      $ref: '../headers.yml#/RequestId'
    Cache-Control:
      $ref: '../headers.yml#/CacheControlNoStore'
  content:
    application/json:
      schema:
        $ref: '../schemas/errors.yml#/ErrorResponse'
      examples:
        binding:
          value:
            code: bind_error
        validation:
          value:
            code: validation_error
            errors:
              - field: title
                code: required
              - field: description
                code: max_length
InvalidReplaceInput:
  description: |
    An invalid path ID returns validation_error with id/invalid_uuid7 before body binding. Malformed
    JSON, incompatible JSON types and unknown fields, including the card's
    read-only created_at and updated_at, return bind_error. Empty bodies and
    invalid field values return validation_error.
  headers:
    X-Request-Id:
      $ref: '../headers.yml#/RequestId'
    Cache-Control:
      $ref: '../headers.yml#/CacheControlNoStore'
  content:
    application/json:
      schema:
        $ref: '../schemas/errors.yml#/ErrorResponse'
      examples:
        invalidId:
          value:
            code: validation_error
            errors:
              - field: id
                code: invalid_uuid7
        binding:
          value:
            code: bind_error
        validation:
          value:
            code: validation_error
            errors:
              - field: title
                code: required
              - field: description
                code: max_length
InvalidCardId:
  description: Path ID is not a hyphenated UUIDv7 with the required variant.
  headers:
    X-Request-Id:
      $ref: '../headers.yml#/RequestId'
    Cache-Control:
      $ref: '../headers.yml#/CacheControlNoStore'
  content:
    application/json:
      schema:
        $ref: '../schemas/errors.yml#/ErrorResponse'
      example:
        code: validation_error
        errors:
          - field: id
            code: invalid_uuid7
NotFound:
  description: No card exists with this ID.
  headers:
    X-Request-Id:
      $ref: '../headers.yml#/RequestId'
    Cache-Control:
      $ref: '../headers.yml#/CacheControlNoStore'
  content:
    application/json:
      schema:
        $ref: '../schemas/errors.yml#/ErrorResponse'
      example:
        code: not_found
PayloadTooLarge:
  description: Request body exceeds the 1 MiB limit.
  headers:
    X-Request-Id:
      $ref: '../headers.yml#/RequestId'
    Cache-Control:
      $ref: '../headers.yml#/CacheControlNoStoreUnlessEarly'
  content:
    application/json:
      schema:
        $ref: '../schemas/errors.yml#/ErrorResponse'
      example:
        code: payload_too_large
UnsupportedMediaType:
  description: A nonempty request body was sent without Content-Type application/json.
  headers:
    X-Request-Id:
      $ref: '../headers.yml#/RequestId'
    Cache-Control:
      $ref: '../headers.yml#/CacheControlNoStore'
  content:
    application/json:
      schema:
        $ref: '../schemas/errors.yml#/ErrorResponse'
      example:
        code: unsupported_media_type
UnexpectedError:
  description: An unexpected server or storage error occurred. Internal details are not returned.
  headers:
    X-Request-Id:
      $ref: '../headers.yml#/RequestId'
    Cache-Control:
      $ref: '../headers.yml#/CacheControlNoStore'
  content:
    application/json:
      schema:
        $ref: '../schemas/errors.yml#/ErrorResponse'
      example:
        code: unexpected_error

InvalidRegistrationInput:
  description: |
    Malformed JSON, incompatible JSON types and unknown fields return
    bind_error. Empty bodies and invalid field values return
    validation_error: email reports required, max_length, invalid_format or
    taken (an account has the email); password reports required,
    invalid_characters, min_length or max_length.
  headers:
    X-Request-Id:
      $ref: '../headers.yml#/RequestId'
    Cache-Control:
      $ref: '../headers.yml#/CacheControlNoStore'
  content:
    application/json:
      schema:
        $ref: '../schemas/errors.yml#/ErrorResponse'
      examples:
        binding:
          value:
            code: bind_error
        taken:
          value:
            code: validation_error
            errors:
              - field: email
                code: taken
        validation:
          value:
            code: validation_error
            errors:
              - field: email
                code: invalid_format
              - field: password
                code: min_length
InvalidLoginInput:
  description: |
    Malformed JSON, incompatible JSON types and unknown fields return
    bind_error. A missing or overlong email or password returns
    validation_error with required or max_length.
  headers:
    X-Request-Id:
      $ref: '../headers.yml#/RequestId'
    Cache-Control:
      $ref: '../headers.yml#/CacheControlNoStore'
  content:
    application/json:
      schema:
        $ref: '../schemas/errors.yml#/ErrorResponse'
      examples:
        binding:
          value:
            code: bind_error
        validation:
          value:
            code: validation_error
            errors:
              - field: password
                code: required
Unauthenticated:
  description: |
    The request carries no valid session: no session cookie, or one whose
    session is unknown, ended or expired. No WWW-Authenticate header is sent:
    cookie sessions have no registered scheme.
  headers:
    X-Request-Id:
      $ref: '../headers.yml#/RequestId'
    Cache-Control:
      $ref: '../headers.yml#/CacheControlNoStore'
  content:
    application/json:
      schema:
        $ref: '../schemas/errors.yml#/ErrorResponse'
      example:
        code: unauthenticated
InvalidCredentials:
  description: |
    The email has no account or the password is wrong; the response doesn't
    say which. Counts as a failed login for the email's per-account limit.
    No WWW-Authenticate header is sent.
  headers:
    X-Request-Id:
      $ref: '../headers.yml#/RequestId'
    Cache-Control:
      $ref: '../headers.yml#/CacheControlNoStore'
  content:
    application/json:
      schema:
        $ref: '../schemas/errors.yml#/ErrorResponse'
      example:
        code: invalid_credentials
CrossOriginRequest:
  description: |
    A browser sent this unsafe request (POST, PUT, PATCH or DELETE) from
    another origin, as Sec-Fetch-Site or Origin shows. Requests from the
    client app's own origin and from non-browser clients pass.
  headers:
    X-Request-Id:
      $ref: '../headers.yml#/RequestId'
    Cache-Control:
      $ref: '../headers.yml#/CacheControlNoStore'
  content:
    application/json:
      schema:
        $ref: '../schemas/errors.yml#/ErrorResponse'
      example:
        code: cross_origin_request
TooManyRequests:
  description: |
    The login is over a rate limit: per client IP, or per account (counting
    failed logins). Limits slow requests down and clear with
    time; no account is locked.
  headers:
    X-Request-Id:
      $ref: '../headers.yml#/RequestId'
    Cache-Control:
      $ref: '../headers.yml#/CacheControlNoStore'
    Retry-After:
      $ref: '../headers.yml#/RetryAfter'
  content:
    application/json:
      schema:
        $ref: '../schemas/errors.yml#/ErrorResponse'
      example:
        code: too_many_requests
