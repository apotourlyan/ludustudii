# Two path items: /api/sessions (sessions) and /api/sessions/current (current).
sessions:
  parameters:
    - $ref: '../components/parameters.yml#/RequestId'
  post:
    tags: [Identity]
    operationId: createSession
    summary: Log in
    description: |
      Creates a session for the email and password and sets its cookie.
      The session the request carried, if any, is deleted, so a token
      planted before the login is worthless after it. Logins are limited per
      client IP, and failed logins per account; a limited login is refused
      before its password is checked. An unknown email and a wrong password
      get the same 401 invalid_credentials.
    requestBody:
      $ref: '../components/requestBodies.yml#/LoginRequest'
    responses:
      '201':
        description: Logged in. The body is the session; Location is the current session's URL.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yml#/RequestId'
          Cache-Control:
            $ref: '../components/headers.yml#/CacheControlNoStore'
          Location:
            description: URL of the current session.
            required: true
            schema:
              type: string
              enum: [/api/sessions/current]
          Set-Cookie:
            $ref: '../components/headers.yml#/SetSessionCookie'
        content:
          application/json:
            schema:
              $ref: '../components/schemas/session.yml#/Session'
      '400':
        $ref: '../components/responses/errors.yml#/InvalidLoginInput'
      '401':
        $ref: '../components/responses/errors.yml#/InvalidCredentials'
      '403':
        $ref: '../components/responses/errors.yml#/CrossOriginRequest'
      '413':
        $ref: '../components/responses/errors.yml#/PayloadTooLarge'
      '415':
        $ref: '../components/responses/errors.yml#/UnsupportedMediaType'
      '429':
        $ref: '../components/responses/errors.yml#/TooManyRequests'
      '500':
        $ref: '../components/responses/errors.yml#/UnexpectedError'
current:
  parameters:
    - $ref: '../components/parameters.yml#/RequestId'
  delete:
    tags: [Identity]
    operationId: deleteCurrentSession
    summary: Log out
    description: |
      Deletes the session the request carries and expires the session cookie.
      Succeeds without a session too.
    security:
      - {}
      - sessionCookie: []
    responses:
      '204':
        description: Logged out. No response body.
        headers:
          X-Request-Id:
            $ref: '../components/headers.yml#/RequestId'
          Cache-Control:
            $ref: '../components/headers.yml#/CacheControlNoStore'
          Set-Cookie:
            $ref: '../components/headers.yml#/ExpireSessionCookie'
      '403':
        $ref: '../components/responses/errors.yml#/CrossOriginRequest'
      '413':
        $ref: '../components/responses/errors.yml#/PayloadTooLarge'
      '500':
        $ref: '../components/responses/errors.yml#/UnexpectedError'
