    CardId:
      $ref: './components/schemas/lcard.yml#/CardId'
    LearningCardInput:
      $ref: './components/schemas/lcard.yml#/LearningCardInput'
    LearningCard:
      $ref: './components/schemas/lcard.yml#/LearningCard'
    CreatedLearningCard:
      $ref: './components/schemas/lcard.yml#/CreatedLearningCard'
    LearningCardPage:
      $ref: './components/schemas/lcard.yml#/LearningCardPage'
    UserId:
      $ref: './components/schemas/user.yml#/UserId'
    Email:
      $ref: './components/schemas/user.yml#/Email'
    RegisterRequest:
      $ref: './components/schemas/user.yml#/RegisterRequest'
    LoginRequest:
      $ref: './components/schemas/user.yml#/LoginRequest'
    User:
      $ref: './components/schemas/user.yml#/User'
    SessionId:
