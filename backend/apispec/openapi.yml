      $ref: './components/headers.yml#/CacheControlNoStore'
    CacheControlNoStoreUnlessEarly:
      $ref: './components/headers.yml#/CacheControlNoStoreUnlessEarly'
    RequestId:
      $ref: './components/headers.yml#/RequestId'
    SetSessionCookie:
      $ref: './components/headers.yml#/SetSessionCookie'
    ExpireSessionCookie:
      $ref: './components/headers.yml#/ExpireSessionCookie'
    RetryAfter:
      $ref: './components/headers.yml#/RetryAfter'
  requestBodies:
