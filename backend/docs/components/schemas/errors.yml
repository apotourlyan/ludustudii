ErrorResponse:
  type: object
  required: [code]
  properties:
    code:
      type: string
      enum:
        - bind_error
        - validation_error
        - param_error
        - not_found
        - method_not_allowed
        - payload_too_large
        - unsupported_media_type
        - unexpected_error
        - request_error
    errors:
      type: array
      description: Per-field failures, included only for validation_error responses.
      minItems: 1
      items:
        $ref: '#/FieldError'
FieldError:
  type: object
  required: [field, code]
  properties:
    field:
      type: string
      example: title
    code:
      type: string
      description: |
        Card fields (title, description) report required or max_length.
        Query parameters report invalid_integer or out_of_range (limit) and
        invalid_uuid7 (cursor). untrimmed and not_normalized are reserved:
        card fields are trimmed and NFC-normalized before validation, so
        these codes are not currently returned.
      enum: [invalid_uuid7, required, max_length, untrimmed, not_normalized, invalid_integer, out_of_range]
