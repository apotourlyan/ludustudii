CardId:
  type: string
  format: uuid
  description: Canonical lowercase, hyphenated UUIDv7 with the RFC 9562 variant.
  pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
  example: 019a0000-0000-7000-8000-000000000001
LearningCardInput:
  type: object
  description: |
    Length constraints apply to the canonical form of each field: NFC
    normalized, with leading and trailing white space removed, counted in
    Unicode code points. Clients should validate that form. The server also
    accepts untrimmed or non-NFC input and canonicalizes it before validation
    and storage, so stored and returned values always satisfy the constraints
    as written.
  required: [title, description]
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
      description: Card title. Length is counted in code points of the canonical form.
      example: OpenAPI
    description:
      type: string
      minLength: 1
      maxLength: 2000
      description: Card description. Length is counted in code points of the canonical form.
      example: A specification for describing HTTP APIs.
LearningCard:
  type: object
  additionalProperties: false
  required: [id, title, description]
  properties:
    id:
      $ref: '#/CardId'
    title:
      $ref: '#/LearningCardInput/properties/title'
    description:
      $ref: '#/LearningCardInput/properties/description'
CreatedLearningCard:
  type: object
  additionalProperties: false
  required: [id]
  properties:
    id:
      $ref: '#/CardId'
LearningCardPage:
  type: object
  additionalProperties: false
  required: [items, next_cursor]
  properties:
    items:
      type: array
      maxItems: 100
      items:
        $ref: '#/LearningCard'
    next_cursor:
      # Inlined rather than $ref'd: OpenAPI 3.0 cannot make a referenced schema nullable.
      type: string
      format: uuid
      nullable: true
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: Last returned card's ID when more cards follow; null on the final page.
