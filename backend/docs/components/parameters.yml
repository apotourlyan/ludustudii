CardId:
  name: id
  in: path
  required: true
  description: Hyphenated UUIDv7 with the RFC 9562 variant. Hexadecimal letters are case-insensitive.
  schema:
    type: string
    format: uuid
    pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    example: 019a0000-0000-7000-8000-000000000001
RequestId:
  name: X-Request-Id
  in: header
  description: Optional client-supplied request ID, echoed back in the X-Request-Id response header and included in server logs. A new ID is generated when omitted.
  schema:
    type: string
Limit:
  name: limit
  in: query
  description: Page size in canonical decimal form, without leading zeros, a plus sign, or whitespace. Omitted or empty values use 20.
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
Cursor:
  name: cursor
  in: query
  description: Hyphenated UUIDv7 from a previous page's next_cursor. Hexadecimal letters are case-insensitive. Omit or send an empty value for the first page.
  schema:
    type: string
    format: uuid
    pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    example: 019a0000-0000-7000-8000-000000000001
