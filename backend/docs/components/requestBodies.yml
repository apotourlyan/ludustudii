LearningCardInput:
  required: true
  description: |
    JSON card content. Each field is NFC normalized and trimmed, then must be
    1 to its maximum length in code points (see LearningCardInput). Omitted or
    null fields are treated as empty and fail validation. Unknown JSON
    properties are ignored.
  content:
    application/json:
      schema:
        $ref: 'schemas/lcard.yml#/LearningCardInput'
      example:
        title: OpenAPI
        description: A specification for describing HTTP APIs.
