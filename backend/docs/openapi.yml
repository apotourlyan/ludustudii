    CardId:
      $ref: './components/parameters.yml#/CardId'
    RequestId:
      $ref: './components/parameters.yml#/RequestId'
    Limit:
      $ref: './components/parameters.yml#/Limit'
    Cursor:
      $ref: './components/parameters.yml#/Cursor'
  headers:
    RequestId:
      $ref: './components/headers.yml#/RequestId'
  requestBodies:
    LearningCardInput:
      $ref: './components/requestBodies.yml#/LearningCardInput'
  schemas:
