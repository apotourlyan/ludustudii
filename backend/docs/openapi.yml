    LearningCard:
      $ref: './components/schemas/lcard.yml#/LearningCard'
    CreatedLearningCard:
      $ref: './components/schemas/lcard.yml#/CreatedLearningCard'
    LearningCardPage:
      $ref: './components/schemas/lcard.yml#/LearningCardPage'
    ErrorResponse:
      $ref: './components/schemas/errors.yml#/ErrorResponse'
    FieldError:
      $ref: './components/schemas/errors.yml#/FieldError'
  responses:
    InvalidQuery:
      $ref: './components/responses/errors.yml#/InvalidQuery'
    InvalidCreateInput:
      $ref: './components/responses/errors.yml#/InvalidCreateInput'
    InvalidReplaceInput:
      $ref: './components/responses/errors.yml#/InvalidReplaceInput'
    InvalidCardId:
      $ref: './components/responses/errors.yml#/InvalidCardId'
    NotFound:
      $ref: './components/responses/errors.yml#/NotFound'
    PayloadTooLarge:
      $ref: './components/responses/errors.yml#/PayloadTooLarge'
    UnsupportedMediaType:
      $ref: './components/responses/errors.yml#/UnsupportedMediaType'
    UnexpectedError:
      $ref: './components/responses/errors.yml#/UnexpectedError'
    HeadSuccess:
      $ref: './components/responses/head.yml#/HeadSuccess'
    HeadInvalidInput:
      $ref: './components/responses/head.yml#/HeadInvalidInput'
    HeadNotFound:
      $ref: './components/responses/head.yml#/HeadNotFound'
    HeadPayloadTooLarge:
      $ref: './components/responses/head.yml#/HeadPayloadTooLarge'
    HeadUnexpectedError:
      $ref: './components/responses/head.yml#/HeadUnexpectedError'
