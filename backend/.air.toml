root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/server/api"
  bin = "./tmp/main"
  include_ext = ["go", "html", "tmpl"]
  exclude_dir = ["tmp", "vendor", "bin", "internal/infra/spa/dist"]
  delay = 1000

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"