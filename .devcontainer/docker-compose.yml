services:
  app:
    container_name: ludustudii
    image: golang:1.27.4
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
      - spa-node-modules:/workspace/frontend/node_modules
      - claude-config:/root/.claude
    working_dir: /workspace
    environment:
      - APP_PORT=8080
      - DB_CONNECTION=postgres://ludus:ludus@db:5432/ludustudii_db?sslmode=disable
      - DB_TEST_CONNECTION=postgres://tester:tester@db_test:5432/ludustudii_db_test?sslmode=disable
      - CLAUDE_CONFIG_DIR=/root/.claude
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5173:5173"

  db:
    container_name: ludustudii_db
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ludus
      POSTGRES_PASSWORD: ludus
      POSTGRES_DB: ludustudii_db
    ports:
      - "127.0.0.1:5432:5432"
    # Ready once Postgres accepts TCP connections. -h skips the socket-only
    # server the image runs while it initializes, so `up --wait` waits for init.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
  
  db_test:
    container_name: ludustudii_db_test
    image: postgres:18-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    tmpfs:
      - /var/lib/postgresql
    environment:
      POSTGRES_USER: tester
      POSTGRES_PASSWORD: tester
      POSTGRES_DB: ludustudii_db_test
    ports:
      - "127.0.0.1:5433:5432"
    # Ready once Postgres accepts TCP connections. -h skips the socket-only
    # server the image runs while it initializes, so `up --wait` waits for init.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  spa-node-modules:
  claude-config:
