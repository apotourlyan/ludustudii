services:
  app:
    container_name: ludustudii
    image: golang:1.27.2
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
      - spa-node-modules:/workspace/frontend/node_modules
    working_dir: /workspace
    ports:
      - "8080:8080"
      - "5173:5173"

  db:
    container_name: ludustudiidb
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ludus
      POSTGRES_PASSWORD: ludus
      POSTGRES_DB: ludustudii_db
    ports:
      - "5432:5432"
  
volumes:
  postgres-data:
  postgres-cfg-data:
  spa-node-modules: