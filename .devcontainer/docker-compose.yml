services:
  app:
    container_name: ludustudii
    image: golang:1.27.3
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
      - spa-node-modules:/workspace/frontend/node_modules
    working_dir: /workspace
    environment:
      - APP_PORT=8080
      - DB_CONNECTION=postgres://ludus:ludus@db:5432/ludustudii_db?sslmode=disable
      - DB_TEST_CONNECTION=postgres://tester:tester@db_test:5432/ludustudii_db_test?sslmode=disable
    ports:
      - "8080:8080"
      - "5173:5173"

  db:
    container_name: ludustudii_db
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ludus
      POSTGRES_PASSWORD: ludus
      POSTGRES_DB: ludustudii_db
    ports:
      - "5432:5432"
  
  db_test:
    container_name: ludustudii_db_test
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - postgres-test-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: tester
      POSTGRES_PASSWORD: tester
      POSTGRES_DB: ludustudii_db_test
    ports:
      - "5433:5432"

volumes:
  postgres-data:
  postgres-test-data:
  spa-node-modules: